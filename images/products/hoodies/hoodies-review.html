ies/product-003.jpg"},{"number":133,"file":"product-004.jpg","path":"images/products/hoodies/product-004.jpg"},{"number":134,"file":"product-010.jpg","path":"images/products/hoodies/product-010.jpg"},{"number":135,"file":"product-011.jpg","path":"images/products/hoodies/product-011.jpg"},{"number":136,"file":"product-012.jpg","path":"images/products/hoodies/product-012.jpg"},{"number":137,"file":"product-017.jpg","path":"images/products/hoodies/product-017.jpg"},{"number":138,"file":"product-018.jpg","path":"images/products/hoodies/product-018.jpg"},{"number":139,"file":"product-019.jpg","path":"images/products/hoodies/product-019.jpg"},{"number":140,"file":"product-023.jpg","path":"images/products/hoodies/product-023.jpg"},{"number":141,"file":"product-024.jpg","path":"images/products/hoodies/product-024.jpg"},{"number":142,"file":"product-026.jpg","path":"images/products/hoodies/product-026.jpg"}];

let currentIndex = 0;

const selections = JSON.parse(
  localStorage.getItem("monoHoodieSelections") || "{}"
);

const select = document.getElementById("productSelect");
const gallery = document.getElementById("gallery");
const currentImages = document.getElementById("currentImages");
const message = document.getElementById("message");

function imageUrl(p) {
  return "/" + p.split("/").map(encodeURIComponent).join("/");
}

products.forEach((product, index) => {
  const option = document.createElement("option");
  option.value = index;
  option.textContent = product.name + " (" + product.id + ")";
  select.appendChild(option);
});

function saveLocal() {
  localStorage.setItem(
    "monoHoodieSelections",
    JSON.stringify(selections)
  );
}

function makeCard(image, selected, onClick) {
  const card = document.createElement("div");
  card.className = "card" + (selected ? " selected" : "");

  const img = document.createElement("img");
  img.src = imageUrl(image.path);
  img.loading = "lazy";

  const number = document.createElement("div");
  number.className = "number";
  number.textContent = "#" + image.number;

  const filename = document.createElement("div");
  filename.className = "filename";
  filename.textContent = image.file;

  card.append(img, number, filename);

  if (selected) {
    const status = document.createElement("div");
    status.className = "status";
    status.textContent = "✓ SELECTED";
    card.appendChild(status);
  }

  card.addEventListener("click", onClick);
  return card;
}

function render() {
  const product = products[currentIndex];
  const selected = selections[product.id] || [];

  select.value = currentIndex;
  document.getElementById("position").textContent =
    currentIndex + 1;

  document.getElementById("productName").textContent =
    product.name + " (" + product.id + ")";

  document.getElementById("selectedCount").textContent =
    selected.length + " selected";

  document.getElementById("previous").disabled =
    currentIndex === 0;

  document.getElementById("next").disabled =
    currentIndex === products.length - 1;

  currentImages.innerHTML = "";

  if (product.images.length === 0) {
    currentImages.textContent = "No current images";
  }

  product.images.forEach((p, index) => {
    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = imageUrl(p);

    const name = document.createElement("div");
    name.className = "filename";
    name.textContent = "Current image " + (index + 1) + ": " + p;

    card.append(img, name);
    currentImages.appendChild(card);
  });

  gallery.innerHTML = "";

  images.forEach(image => {
    const isSelected = selected.includes(image.path);

    const card = makeCard(image, isSelected, () => {
      const current = selections[product.id] || [];
      const exists = current.includes(image.path);

      selections[product.id] = exists
        ? current.filter(p => p !== image.path)
        : [...current, image.path];

      saveLocal();
      render();
    });

    gallery.appendChild(card);
  });

  message.textContent =
    "Selections are saved in this browser.";
}

select.addEventListener("change", () => {
  currentIndex = Number(select.value);
  render();
});

document.getElementById("previous").onclick = () => {
  if (currentIndex > 0) {
    currentIndex--;
    render();
  }
};

document.getElementById("next").onclick = () => {
  if (currentIndex < products.length - 1) {
    currentIndex++;
    render();
  }
};

document.getElementById("clear").onclick = () => {
  const product = products[currentIndex];

  if (confirm("Clear selected images for " + product.name + "?")) {
    delete selections[product.id];
    saveLocal();
    render();
  }
};

document.getElementById("export").onclick = () => {
  const output = {
    project: "MoNo ARC",
    type: "Hoodie image review",
    selections
  };

  const blob = new Blob(
    [JSON.stringify(output, null, 2)],
    {type: "application/json"}
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "hoodie-image-selections.json";
  link.click();

  URL.revokeObjectURL(url);
  message.textContent = "JSON export requested.";
};

render();
</script>
