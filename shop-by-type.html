<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080809">
<title>Shop by Type | MONO ARC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0c0c0d;--line:#292a2d;--steel:#85878e;--silver:#d6d7da;--text:#b4b6bb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:300 15px/1.8 Manrope,Arial,sans-serif}a{color:inherit;text-decoration:none}header{position:sticky;top:0;z-index:5;background:#080809ed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:18px 5vw;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font:500 19px Georgia,serif;letter-spacing:.45em;color:var(--silver)}nav{display:flex;gap:22px;flex-wrap:wrap;font-size:12px;letter-spacing:.12em}nav a:hover,.back:hover{color:#fff}.pagehead{padding:100px 5vw 30px}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--steel)}h1,h2,h3{font-family:Georgia,serif;color:var(--silver);font-weight:400}h1{font-size:clamp(42px,7vw,78px);line-height:1.05;margin:10px 0} .pagehead p{max-width:580px}.wrap{padding:30px 5vw 100px}.tiles,.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.tile{min-height:190px;border:1px solid var(--line);padding:22px;background:linear-gradient(145deg,#1a1b1e,#050505);display:flex;flex-direction:column;justify-content:space-between;transition:.2s}.tile:hover{border-color:var(--silver);transform:translateY(-3px)}.tile small,.muted{color:var(--steel);font-size:11px;letter-spacing:.12em}.tile h2{font-size:27px;margin:18px 0}.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px}.tools input,.tools select{background:#09090a;border:1px solid var(--line);padding:12px 14px;color:var(--silver);font:inherit;min-width:170px}.products{grid-template-columns:repeat(4,minmax(0,1fr))}.product{min-width:0}.photo{aspect-ratio:4/5;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.placeholder{font:12px Georgia,serif;letter-spacing:.18em;color:#555}.product h3{font-size:20px;margin:10px 0 0}.price{color:var(--steel);font-size:13px;margin:0}.card-size{width:100%;min-width:0;margin-top:12px;padding:10px 12px;border:1px solid var(--line);background:#09090a;color:var(--silver);font:inherit;font-size:12px}.card-add{display:block;width:100%;margin-top:8px;padding:10px 12px;border:1px solid var(--steel);background:transparent;color:var(--silver);font:inherit;font-size:11px;letter-spacing:.14em;cursor:pointer;transition:background .25s,color .25s}.card-add:hover{background:var(--silver);color:#000}.cart{color:var(--silver);font-size:12px;letter-spacing:.12em;white-space:nowrap}.toast{position:fixed;left:50%;bottom:24px;z-index:20;padding:10px 18px;background:var(--silver);color:#000;opacity:0;pointer-events:none;transform:translate(-50%,20px);transition:.25s}.toast.on{opacity:1;transform:translate(-50%,0)}.empty{padding:35px;border:1px solid var(--line);color:var(--steel)}footer{padding:28px 5vw;border-top:1px solid var(--line);color:var(--steel);font-size:12px}@media(max-width:900px){.tiles,.products{grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.tiles,.products{grid-template-columns:1fr 1fr;gap:10px}.tile{min-height:150px;padding:15px}.tile h2{font-size:21px}.pagehead{padding-top:65px}}
.products{align-items:stretch}.product{display:flex;flex-direction:column}.product h3{height:2.4em;line-height:1.2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.product .price{min-height:1.8em}.product .card-size{margin-top:auto}.product .card-add{min-height:42px}
</style>
</head>
<body data-page="type">
<header>
<a class="brand" href="index.html">MONO ARC</a>
<nav aria-label="Main navigation">
<a href="index.html#/shop">SHOP ALL</a>
<a href="shop-by-item.html">SHOP BY ITEM</a>
<a href="shop-by-type.html">SHOP BY TYPE</a>
<a href="shop-by-anime.html">SHOP BY ANIME</a>
<a href="index.html#/collections">OUR COLLECTION</a>
<a href="index.html#/accessories">ACCESSORIES</a>
</nav>
<a class="cart" href="index.html">BAG (<span id="bc">0</span>)</a>
</header>
<main>
<div class="pagehead">
<div class="eyebrow">MONO ARC / SHOP</div>
<h1 id="heading">Shop by Type</h1>
<p id="description">Find something that fits your style.</p>
</div>
<section class="wrap" id="content"></section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<footer><a href="index.html">← Back to MONO ARC</a></footer>
<script src="products.js"></script>
<script>
(()=>{
const products=window.MONO_PRODUCTS||[];
const accessoryIds=new Set(products.filter(product=>product.cat==="accessories").map(product=>product.id));
const cart=JSON.parse(localStorage.getItem("mono_cart")||"[]").reduce((items,item)=>{
  if(!accessoryIds.has(item.id)){items.push(item);return items;}
  const existing=items.find(entry=>entry.id===item.id&&entry.size==="");
  if(existing)existing.qty+=item.qty;
  else items.push({...item,size:""});
  return items;
},[]);
localStorage.setItem("mono_cart",JSON.stringify(cart));
const titleCase=value=>value.replace(/-/g," ").replace(/\b\w/g,char=>char.toUpperCase());
const ITEM_LABELS={tees:"T-shirts",frames:"Frames",sets:"Sets"};
const ITEM_GROUPS=Object.fromEntries([...new Set(products.map(p=>p.cat))].sort().map(category=>{const label=ITEM_LABELS[category]||titleCase(category);return[category,[label,"SHOP BY ITEM"]];}));
const TYPE_GROUPS=Object.fromEntries([...new Set(products.flatMap(p=>p.typeTags||[]))].sort().map(type=>[type,titleCase(type)]));
const ANIME_GROUPS=[...new Map(products.flatMap(p=>p.animeTags||[]).map(anime=>[anime.toLowerCase(),anime])).values()].sort((a,b)=>a.localeCompare(b));
const page=document.body.dataset.page;const params=new URLSearchParams(location.search);const root=document.getElementById("content");
const money=n=>new Intl.NumberFormat("en-ZA",{style:"currency",currency:"ZAR",maximumFractionDigits:0}).format(Number(n||0));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const tile=(url,title,sub)=>'<a class="tile" href="'+url+'"><small>EXPLORE</small><h2>'+title+'</h2><small>'+sub+'</small></a>';
const card=p=>{
  const sizeSelect=p.cat==="accessories"?"":'<select class="card-size" aria-label="Select size for '+p.name.replace(/"/g,'&quot;')+'"><option value="">SELECT SIZE</option>'+((p.sizes&&p.sizes.length?p.sizes:["S","M","L","XL","XXL"]).map(size=>'<option value="'+size+'">'+size+'</option>').join(""))+'</select>';
  const sizeArgument=p.cat==="accessories"?"''":"this.previousElementSibling.value";
  return '<article class="product"><div class="photo">'+(p.imgs&&p.imgs[0]?'<img loading="lazy" src="'+p.imgs[0]+'" alt="'+p.name.replace(/"/g,'&quot;')+'">':'<span class="placeholder">MONO ARC</span>')+'</div><h3>'+p.name+'</h3><p class="price">'+money(p.price)+'</p>'+sizeSelect+'<button class="card-add" type="button" onclick="addToCart(\''+p.id+'\','+sizeArgument+')">ADD TO CART</button></article>';
};
function updateCartCount(){document.getElementById("bc").textContent=cart.reduce((count,item)=>count+item.qty,0);}
function showToast(message){const toast=document.getElementById("toast");toast.textContent=message;toast.classList.add("on");setTimeout(()=>toast.classList.remove("on"),3000);}
window.addToCart=(productId,size)=>{
  const product=products.find(item=>item.id===productId);
  if(!product){showToast("Product not found.");return;}
  const cartSize=product.cat==="accessories"?"":size;
  if(product.cat!=="accessories"&&!cartSize){showToast("Please select a size first.");return;}
  const existing=cart.find(item=>item.id===productId&&item.size===cartSize);
  if(existing){existing.qty++;}else{cart.push({id:product.id,name:product.name,price:Number(product.price),size:cartSize,img:(product.imgs&&product.imgs[0])||"",qty:1});}
  localStorage.setItem("mono_cart",JSON.stringify(cart));
  updateCartCount();
  showToast(product.name+(cartSize?" ("+cartSize+")":"")+" added to cart.");
};
function showProducts(list){root.innerHTML='<div class="tools"><input id="search" type="search" placeholder="Search products..." aria-label="Search products"><select id="sort" aria-label="Sort products"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name: A to Z</option></select></div><div class="products" id="results">'+(list.length?list.map(card).join(""):'<div class="empty">Nothing in this section yet, check back soon.</div>')+'</div>';
const search=document.getElementById("search"),sort=document.getElementById("sort"),results=document.getElementById("results");const update=()=>{let found=list.filter(p=>p.name.toLowerCase().includes(search.value.trim().toLowerCase()));if(sort.value==="low")found.sort((a,b)=>a.price-b.price);if(sort.value==="high")found.sort((a,b)=>b.price-a.price);if(sort.value==="name")found.sort((a,b)=>a.name.localeCompare(b.name));results.innerHTML=found.length?found.map(card).join(""):'<div class="empty">Nothing matches your search.</div>';};search.addEventListener("input",update);sort.addEventListener("change",update);}
function setHead(title,description){document.title=title+" | MONO ARC";document.getElementById("heading").textContent=title;document.getElementById("description").textContent=description;}
updateCartCount();
if(page==="item"){const category=params.get("category");if(category&&ITEM_GROUPS[category]){setHead(ITEM_GROUPS[category][0],ITEM_GROUPS[category][1]);showProducts(products.filter(p=>p.cat===category));}else{setHead("Shop by Item","Pick the kind of item you’re looking for.");root.innerHTML='<div class="tiles">'+Object.entries(ITEM_GROUPS).map(([k,v])=>tile('?category='+encodeURIComponent(k),v[0],v[1])).join("")+'</div>';}}
else if(page==="type"){const type=params.get("type");if(type&&TYPE_GROUPS[type]){setHead(TYPE_GROUPS[type],"Pieces picked for this edit.");showProducts(products.filter(p=>(p.typeTags||[]).includes(type)));}else{setHead("Shop by Type","Find something that fits your style.");root.innerHTML='<div class="tiles">'+Object.entries(TYPE_GROUPS).map(([k,v])=>tile('?type='+encodeURIComponent(k),v,"CURATED EDIT")).join("")+'</div>';}}
else if(page==="anime"){const anime=params.get("anime");if(anime&&ANIME_GROUPS.includes(anime)){setHead(anime,"Anime-inspired pieces from MONO ARC.");showProducts(products.filter(p=>(p.animeTags||[]).some(tag=>tag.toLowerCase()===anime.toLowerCase())));}else{setHead("Shop by Anime","Shop anime-inspired pieces by series.");root.innerHTML='<div class="tiles">'+ANIME_GROUPS.map(v=>tile('?anime='+encodeURIComponent(v),v,"ANIME COLLECTION")).join("")+'</div>';}}
})();
</script>
</body>
</html>
